<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý - CRUD Application</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-icon">🚀</div>
                <div>
                    <h1>Hệ Thống Quản Lý Items</h1>
                    <p>Node.js + MySQL + Railway.app</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="dashboard.html" class="header-btn">
                    <span>📊</span>
                    <span>Dashboard</span>
                </a>
            </div>
            <div class="header-stats" id="header-stats">
                <div class="stat-item">
                    <span class="stat-number" id="total-items">0</span>
                    <span class="stat-label">Tổng Items</span>
                </div>
            </div>
        </header>

        <div class="form-section">
            <div class="section-header">
                <h2 id="form-title">
                    <span class="icon">➕</span>
                    Thêm Item Mới
                </h2>
            </div>
            <form id="item-form">
                <input type="hidden" id="item-id">
                
                <div class="form-group">
                    <label for="name">
                        <span class="label-icon">📝</span>
                        Tên Item <span class="required">*</span>
                    </label>
                    <input type="text" id="name" required placeholder="Nhập tên item...">
                </div>

                <div class="form-group">
                    <label for="description">
                        <span class="label-icon">📄</span>
                        Mô tả
                    </label>
                    <textarea id="description" rows="4" placeholder="Nhập mô tả chi tiết..."></textarea>
                </div>

                <div class="form-group">
                    <label for="status">
                        <span class="label-icon">⚡</span>
                        Trạng thái
                    </label>
                    <select id="status">
                        <option value="active">✅ Active</option>
                        <option value="inactive">⏸️ Inactive</option>
                        <option value="pending">⏳ Pending</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-primary">
                        <span class="btn-icon">💾</span>
                        <span class="btn-text">Thêm Item</span>
                    </button>
                    <button type="button" id="cancel-btn" class="btn-secondary" style="display: none;" onclick="cancelEdit()">
                        <span class="btn-icon">❌</span>
                        <span class="btn-text">Hủy</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="items-section">
            <div class="section-header">
                <h2>
                    <span class="icon">📋</span>
                    Danh Sách Items
                </h2>
                <div class="section-actions">
                    <button class="btn-refresh" onclick="loadItems()" title="Làm mới">
                        🔄
                    </button>
                </div>
            </div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Đang tải dữ liệu...</p>
            </div>
            <div id="items-list" class="items-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
