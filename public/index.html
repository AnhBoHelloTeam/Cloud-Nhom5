<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý - CRUD Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Hệ Thống Quản Lý Items</h1>
            <p>Node.js + MySQL + Railway.app</p>
        </header>

        <div class="form-section">
            <h2 id="form-title">Thêm Item Mới</h2>
            <form id="item-form">
                <input type="hidden" id="item-id">
                
                <div class="form-group">
                    <label for="name">Tên Item *</label>
                    <input type="text" id="name" required placeholder="Nhập tên item">
                </div>

                <div class="form-group">
                    <label for="description">Mô tả</label>
                    <textarea id="description" rows="3" placeholder="Nhập mô tả"></textarea>
                </div>

                <div class="form-group">
                    <label for="status">Trạng thái</label>
                    <select id="status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Thêm Item</button>
                    <button type="button" id="cancel-btn" style="display: none;" onclick="cancelEdit()">Hủy</button>
                </div>
            </form>
        </div>

        <div class="items-section">
            <h2>Danh Sách Items</h2>
            <div id="loading" class="loading">Đang tải...</div>
            <div id="items-list" class="items-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
